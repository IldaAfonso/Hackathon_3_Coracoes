# Servidor do frontend: arquivos estáticos + proxy reverso para a API.
#
# É um TEMPLATE: na partida do container o nginx troca ${CORA_FRAME_SRC}
# (só as variáveis definidas no ambiente; $host, $uri etc. ficam intactas)
# e grava o resultado em /etc/nginx/conf.d/. Ver Dockerfile.

upstream dna_backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.inc;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API: proxy para o backend ------------------------------------
    location /api/ {
        proxy_pass http://dna_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;      # o 1º uso do modelo de ML treina na hora
        client_max_body_size 26m;     # importação de planilha (limite da API: 25 MB)
    }

    # --- MCP: ferramentas da DNA da Máquina para a Cora ----------------
    # A Cora chama POST /mcp (streamable HTTP, respostas em SSE). Sem
    # buffer, para cada evento chegar na hora. O Host original segue
    # junto ($http_host, com a porta): o backend só aceita hosts da
    # lista DNA_MCP_ALLOWED_HOSTS (proteção contra DNS rebinding).
    location = /mcp {
        proxy_pass http://dna_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;      # modos de falha: 1ª chamada treina o NMF
        client_max_body_size 1m;
    }

    # --- estáticos: cache longo para vendor/assets, curto para o resto -
    location ~* ^/(vendor|assets)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri /index.html;
    }
}
